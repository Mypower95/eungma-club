const stories=[{type:'AI 실무 노트',cover:'일을 덜어내는 AI',title:'AI 도구는 많은데, 내 업무에는 어떻게 쓰죠?',author:'루카',time:'5분',body:'시작은 도구가 아니라 반복하는 업무에서 찾아보세요. 일주일 동안 두 번 이상 반복한 일을 적고, 입력 자료와 원하는 결과물이 가장 명확한 업무를 하나 고릅니다.\n\n예를 들어 캠페인 가이드와 원고를 넣으면 누락된 항목을 표로 알려주는 검수 도구부터 만들어볼 수 있어요. 처음부터 모든 과정을 자동화할 필요는 없습니다.\n\n동료에게 설명할 수 있을 만큼 작은 단위로 만들어보고, 결과를 직접 검수하면서 기준을 보완해 보세요.'},{type:'콘텐츠 인사이트',cover:'좋은 글의 다음',title:'혼자 쓰는 뉴스레터를 함께 만드는 일',author:'응마 에디터',time:'4분',body:'마감 앞에서 혼자 고민하던 글도 누군가에게 읽어달라고 부탁하면 다음 문장이 보입니다.\n\n초고가 완벽해질 때까지 기다리는 대신, 지금 가장 전하고 싶은 한 문장을 공유해 보세요. 읽는 사람이 무엇을 기억했는지 물어보면 글의 방향이 선명해집니다.\n\n응마클럽의 콘텐츠 작업실은 그렇게 서로의 첫 독자가 되어주는 시간을 지향합니다.'},{type:'커리어 이야기',cover:'우리, 잘하고 있나요?',title:'회사 밖 동료가 생기면 달라지는 것들',author:'마파',time:'3분',body:'비슷한 고민을 하는 사람이 있다는 사실만으로도 일하는 마음이 조금 가벼워집니다.\n\n회사 안에서는 묻기 어려웠던 질문을 나누고, 다른 팀의 방식을 들으면서 내 방식도 다시 보게 되죠. 정답을 알려주는 사람보다 생각을 함께 정리해주는 동료가 필요할 때가 있습니다.\n\n응마클럽에서 그런 대화를 시작해 보려고 합니다.'}];
const $=s=>document.querySelector(s);let saved=JSON.parse(localStorage.getItem('eungma-saved')||'[]');let applications=JSON.parse(localStorage.getItem('eungma-applications')||'[]');let category='전체',query='',sort='date',mineTab='applied';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>n.toLocaleString('ko-KR')+'원';const date=s=>{let d=new Date(s+'T12:00:00');return `${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')} (${['일','월','화','수','목','금','토'][d.getDay()]})`};const persist=()=>{localStorage.setItem('eungma-saved',JSON.stringify(saved));localStorage.setItem('eungma-applications',JSON.stringify(applications))};
function poster(m,extra=''){return `<div class="poster ${m.style} ${extra}"><small>${m.kicker}</small><strong>${m.poster.includes(',')?m.poster.replace(',','<br>'):m.poster}</strong><span class="p-bottom">${m.sub}</span><span class="poster-art" aria-hidden="true">${m.art}</span></div>`}
function card(m,applied=false){return `<article class="card"><div class="poster-container"><button style="padding:0;width:100%" data-detail="${m.id}" aria-label="${m.title} 상세 보기">${poster(m)}</button><button class="bookmark ${saved.includes(m.id)?'saved':''}" data-save="${m.id}" aria-label="${m.title} 찜 ${saved.includes(m.id)?'해제':'하기'}" aria-pressed="${saved.includes(m.id)}">${saved.includes(m.id)?'♥':'♡'}</button></div><div class="tags"><span class="tag">${m.category}</span><span class="tag ${m.seats<=4?'urgent':''}">${m.seats<=4?'마감 임박':'모집 중'} · ${m.seats}자리</span></div><button class="card-title" data-detail="${m.id}">${m.title}</button><p class="meta">${date(m.date)} · ${m.place}</p><p class="price">${money(m.price)}<span>1인 · 예시 가격</span></p>${applied?`<div class="application-state">체험 신청 완료 <button data-cancel="${m.id}">신청 취소</button></div>`:''}</article>`}
function storyCards(){return stories.map((s,i)=>`<button class="story" data-story="${i}"><div class="story-cover"><span>${s.cover}</span></div><div><div class="type">${s.type}</div><h3>${s.title}</h3><p class="meta">${s.author} · ${s.time} 읽기</p></div></button>`).join('')}
function filters(){return `<div class="filters" aria-label="모임 주제">${['전체','AI·자동화','콘텐츠','커리어','네트워킹'].map(c=>`<button class="chip ${category===c?'selected':''}" data-category="${c}" aria-pressed="${category===c}">${c==='전체'?'✳ 전체 모임':c}</button>`).join('')}</div>`}
function home(){return `<div class="wrap"><section class="hero"><div class="hero-copy"><div class="eyebrow"><i></i> FOR MARKETERS, BY MARKETERS</div><h1>좋은 마케터의 다음은,<br><em>함께.</em></h1><p>혼자 고민하던 일을 함께 풀고,<br>다음 시도를 응원하는 동료를 만나세요.</p><a class="primary" href="#meetings">나에게 맞는 모임 찾기</a></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="orbit two"></div><span class="spark">✳</span><div class="bubble">요즘 무슨 고민 해요?</div><div class="bubble dark">우리, 같이 해봐요.</div><span class="hero-sticker">A LITTLE TALK. A NEW CHAPTER.</span></div></section><div class="intro-row"><p><strong>응답하라 마케팅에서 시작된 연결</strong><br>읽는 사이에서, 함께하는 사이로.</p><div class="mini-avatars"><div class="faces"><span>👩🏻</span><span>🧑🏻</span><span>👩🏼</span><span>👨🏻</span></div><span>우리의 다음 이야기는 여기서</span></div></div><section class="section" id="home-meetings"><div class="section-head"><div><h2>지금, 함께할 모임</h2><p>관심사가 닮은 동료와 작은 시도를 시작해 보세요.</p></div><a class="text-link" href="#meetings">전체 모임 보기</a></div>${filters()}<div class="grid" id="meeting-grid">${filteredCards()}</div></section><aside class="banner"><div class="banner-left"><span class="banner-icon">☕</span><div><strong>모임 전에도, 모임 후에도. 대화는 계속!</strong><p>마케터의 소소한 질문부터 실무 팁까지 오픈채팅에서 나눠요.</p></div></div><a href="https://open.kakao.com/o/gtHNzLXi" target="_blank" rel="noopener">응마클럽 오픈채팅 참여</a></aside><section class="section"><div class="section-head"><div><h2>마케터의 이야기</h2><p>나만의 고민인 줄 알았던, 우리들의 이야기.</p></div><a class="text-link" href="#stories">모두 읽어보기</a></div><div class="stories-grid">${storyCards()}</div></section><section class="club-band"><div><h2>같이 하면, 다음이 보이니까.</h2><p>완벽한 전문가가 아니어도 괜찮아요.<br>서로의 시도를 응원하는 마케터들의 아지트, 응마클럽.</p></div><button data-go="about">응마클럽 알아보기</button></section></div>`}
function filtered(){return meetings.filter(m=>(category==='전체'||m.category===category)&&(!query||[m.title,m.category,m.place,m.host].join(' ').toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>sort==='price'?a.price-b.price:sort==='seats'?a.seats-b.seats:a.date.localeCompare(b.date))}
function filteredCards(){const arr=filtered();return arr.length?arr.map(m=>card(m)).join(''):`<div class="empty"><h3>조건에 맞는 모임이 없어요</h3><p>다른 검색어나 주제를 선택해 보세요.</p><button class="secondary" data-reset>필터 초기화</button></div>`}
function meetingPage(){return `<div class="wrap list-space"><div class="page-top"><div class="eyebrow">FIND YOUR PEOPLE</div><h1>나의 다음을 함께할 모임</h1><p>새로운 도구, 새로운 관점, 새로운 동료를 만나보세요.</p></div><div class="toolbar"><input class="search" type="search" placeholder="모임, 주제, 지역으로 검색" aria-label="모임 검색" value="${esc(query)}"><select class="sort" aria-label="모임 정렬"><option value="date">가까운 일정순</option><option value="price">낮은 가격순</option><option value="seats">남은 자리순</option></select></div>${filters()}<p class="count" id="result-count">총 ${filtered().length}개의 모임 · 모든 일정은 프로토타입 예시입니다</p><div class="grid" id="meeting-grid">${filteredCards()}</div></div>`}
function mine(){let ids=mineTab==='applied'?applications.map(x=>x.id):saved;let arr=meetings.filter(m=>ids.includes(m.id));return `<div class="wrap list-space"><div class="page-top"><div class="eyebrow">MY CLUB</div><h1>나의 응마클럽</h1><p>관심 있는 모임과 함께할 순간을 모아뒀어요.</p></div><div class="tabs"><button data-tab="applied" class="${mineTab==='applied'?'selected':''}">신청한 모임 ${applications.length}</button><button data-tab="saved" class="${mineTab==='saved'?'selected':''}">찜한 모임 ${saved.length}</button></div><p class="count">이 기기에 저장된 체험 내역입니다. 실제 참가 신청은 접수되지 않습니다.</p><div class="grid">${arr.length?arr.map(m=>card(m,mineTab==='applied')).join(''):`<div class="empty"><h3>${mineTab==='saved'?'아직 찜한 모임이 없어요':'아직 신청한 모임이 없어요'}</h3><p>마음에 드는 모임을 찾아 첫 번째 만남을 준비해 보세요.</p><a class="primary" href="#meetings">모임 둘러보기</a></div>`}</div></div>`}
function about(){return `<div class="wrap"><section class="about-hero"><div class="eyebrow">THIS IS EUNGMA CLUB</div><h1>읽는 사이에서,<br><em>함께하는 사이로.</em></h1><p>응마클럽은 ‘응답하라 마케팅’에서 시작된 마케터 커뮤니티입니다. 뉴스레터에서 나누던 이야기를 넘어, 직접 만나 질문하고 만들고 서로의 경험을 나눠보려 합니다.</p><p>무엇이든 다 아는 사람보다 새로운 시도를 함께 해볼 동료를 기다립니다.</p><a class="primary" href="#meetings">첫 모임 찾아보기</a></section><div class="values"><div class="value"><span>✳</span><h3>직접 해봐요</h3><p>새로운 도구를 배우는 데서 한 걸음 더. 내 업무에 쓸 결과물을 만들어봐요.</p></div><div class="value"><span>“ ”</span><h3>편하게 물어요</h3><p>회사에서 묻기 어려웠던 질문도 괜찮아요. 각자의 경험에서 힌트를 찾아요.</p></div><div class="value"><span>↗</span><h3>다음을 응원해요</h3><p>작은 시도와 실패도 나누면서, 다음 한 걸음을 함께 고민해요.</p></div></div></div>`}
function render(){let route=location.hash.slice(1)||'home';$('#app').innerHTML=route==='meetings'?meetingPage():route==='mine'?mine():route==='stories'?`<div class="wrap list-space"><div class="page-top"><div class="eyebrow">FROM OUR DESKS</div><h1>마케터의 이야기</h1><p>함께 읽고 나누는 일과 성장의 기록. 아래 글은 체험용 예시입니다.</p></div><div class="stories-grid section">${storyCards()}</div></div>`:route==='about'?about():home();document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===route));if($('.sort'))$('.sort').value=sort}
function updateResults(){if($('#meeting-grid'))$('#meeting-grid').innerHTML=filteredCards();if($('#result-count'))$('#result-count').textContent=`총 ${filtered().length}개의 모임 · 모든 일정은 프로토타입 예시입니다`;document.querySelectorAll('[data-category]').forEach(b=>{b.classList.toggle('selected',b.dataset.category===category);b.setAttribute('aria-pressed',b.dataset.category===category)})}
const modal=$('#detail');function show(html){modal.innerHTML=`<button class="close" aria-label="닫기" data-close>×</button>${html}`;if(!modal.open)modal.showModal()}
function detail(id){let m=meetings.find(m=>m.id===id);let applied=applications.some(x=>x.id===id);show(`${poster(m,'modal-poster')}<div class="modal-body"><div class="tags"><span class="tag">${m.category}</span><span class="tag urgent">${m.seats}자리 남음</span><span class="tag">예시 모임</span></div><h2>${m.title}</h2><p>${m.description}</p><div class="facts"><div><label>언제</label>${date(m.date)} ${m.time}</div><div><label>어디서</label>${m.place} · 장소 미확정</div><div><label>누구와</label>${m.host}</div><div><label>참가비</label>${money(m.price)} · 예시</div></div><h3>우리는 이렇게 함께해요</h3><ol>${m.agenda.map(x=>`<li>${x}</li>`).join('')}</ol><h3>이것만 챙겨오세요</h3><p>${m.bring}</p><p class="smallnote">프로토타입 예시 모임입니다. 실제 모집·결제는 진행되지 않습니다.</p><div class="modal-actions"><button class="secondary" data-save="${id}">${saved.includes(id)?'♥ 찜했어요':'♡ 찜하기'}</button><button class="primary" ${applied?'data-go="mine"':`data-apply="${id}"`}>${applied?'신청 내역 보기':'참가 신청 체험하기'}</button></div></div>`)}
function apply(id){let m=meetings.find(x=>x.id===id);show(`<div class="modal-body"><div class="eyebrow">JOIN THE CLUB</div><h2>우리, 곧 만나요.</h2><p>${m.title}</p><form id="application-form" data-id="${id}"><label class="form-field">이름 또는 닉네임<input name="nickname" required maxlength="30" placeholder="모임에서 불릴 이름을 알려주세요" autocomplete="off"></label><label class="form-field">하고 있는 일<select name="role" required><option value="">직무를 선택해 주세요</option><option>그로스·퍼포먼스 마케팅</option><option>콘텐츠·브랜드 마케팅</option><option>CRM 마케팅</option><option>기획·디자인·개발</option><option>학생·취업 준비</option><option>기타</option></select></label><label class="form-field">함께 나누고 싶은 고민 (선택)<textarea name="question" rows="3" maxlength="500" placeholder="요즘 어떤 일이 가장 궁금하세요?"></textarea></label><label class="checkbox"><input type="checkbox" required>체험용 신청이며 실제 참가 신청·결제가 진행되지 않는다는 점을 확인했습니다.</label><p class="smallnote">입력 내용은 이 기기의 브라우저에만 저장됩니다.</p><div class="modal-actions"><button type="button" class="secondary" data-detail="${id}">이전</button><button type="submit" class="primary">체험 신청 완료하기</button></div></form></div>`)}
let toastTimer;function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2400)}
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-go]');if(!b)return;if(b.dataset.go){modal.close();if(location.hash==='#'+b.dataset.go)render();else location.hash=b.dataset.go}if(b.hasAttribute('data-close'))modal.close();if(b.dataset.detail)detail(b.dataset.detail);if(b.dataset.apply)apply(b.dataset.apply);if(b.dataset.category){category=b.dataset.category;updateResults()}if(b.hasAttribute('data-reset')){category='전체';query='';if($('.search'))$('.search').value='';updateResults()}if(b.dataset.save){let id=b.dataset.save;let was=saved.includes(id);saved=was?saved.filter(x=>x!==id):[...saved,id];persist();if(modal.open)detail(id);render();toast(was?'찜한 모임에서 삭제했어요':'찜한 모임에 저장했어요')}if(b.dataset.tab){mineTab=b.dataset.tab;render()}if(b.dataset.cancel){let id=b.dataset.cancel;show(`<div class="modal-body"><h2>체험 신청을 취소할까요?</h2><p>취소 후에도 모임 찾기에서 다시 신청해볼 수 있어요.</p><div class="modal-actions"><button class="secondary" data-close>유지하기</button><button class="primary" data-confirm-cancel="${id}">신청 취소하기</button></div></div>`)}if(b.dataset.confirmCancel){applications=applications.filter(x=>x.id!==b.dataset.confirmCancel);persist();modal.close();render();toast('체험 신청이 취소됐어요')}if(b.dataset.story){let s=stories[+b.dataset.story];show(`<article class="modal-body"><div class="eyebrow">${s.type} · 예시 아티클</div><h2>${s.title}</h2><p class="meta">${s.author} · ${s.time} 읽기</p>${s.body.split('\n\n').map(p=>`<p>${p}</p>`).join('')}<button class="primary" data-go="meetings">함께 이야기할 모임 찾기</button></article>`)}});
document.addEventListener('input',e=>{if(e.target.matches('.search')){query=e.target.value;updateResults()}});document.addEventListener('change',e=>{if(e.target.matches('.sort')){sort=e.target.value;updateResults()}});document.addEventListener('submit',e=>{if(e.target.id!=='application-form')return;e.preventDefault();let form=e.target,id=form.dataset.id,data=new FormData(form);if(!applications.some(x=>x.id===id))applications.push({id,nickname:data.get('nickname').trim(),role:data.get('role'),question:data.get('question'),createdAt:new Date().toISOString()});persist();show(`<div class="modal-body success"><div class="success-icon">✓</div><h2>첫 번째 연결이 시작됐어요.</h2><p>${esc(data.get('nickname').trim())}님, 체험 신청을 완료했어요.<br>내 활동에서 신청 내역을 확인해 보세요.</p><p class="smallnote">실제 신청·결제·메시지 발송은 이루어지지 않았습니다.</p><button class="primary" data-go="mine">내 신청 내역 보기</button></div>`);render()});modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});window.addEventListener('hashchange',()=>{modal.close();render();window.scrollTo(0,0)});render();
</script></body></html>
